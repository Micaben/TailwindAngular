@if (state?.isOpen) {
<app-modal [isOpen]="state.isOpen" (close)="close.emit()" className="w-full max-w-4xl p-4">
  <div appAutoFocusFirst [focusTrigger]="focusCounter"
    class="no-scrollbar relative w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-11">
    <div class="px-2">
      <h4 class="mb-2 text-2xl font-semibold text-gray-800 dark:text-white/90">
        Proveedores
      </h4>

      <p class="mb-6 text-sm text-gray-500 dark:text-gray-400 lg:mb-7">
        Ingresa o cambia los datos para tener la información actualizada.
      </p>

      <form class="flex flex-col flex-1 overflow-hidden" #form="ngForm" (ngSubmit)="save.emit(form)">
        <div class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="md:col-span-1">
              <label appLabel>Tipo Documento</label>
              <app-select-field [options]="tipoDocumentoOptions" [ngModel]="selectedSafe.tipo_documento"
                (ngModelChange)="update('tipo_documento', $event)" name="tipo_documento" [required]="true" #tipo_documento="ngModel"
                [control]="tipo_documento">
              </app-select-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>Numero</label>
              <app-input-field [ngModel]="selectedSafe.ruc" (ngModelChange)="update('ruc', $event)" name="ruc"
                [disabled]="state.modo === 'editar'" [submitted]="submitted" [required]="true" pattern="^[0-9]*$"
                [minLength]="8" [maxLength]="11" [onlyNumbers]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>Tipo Persona</label>
              <app-select-field [options]="tipoPersonaOptions" [ngModel]="selectedSafe.tipo_persona"
                (ngModelChange)="update('tipo_persona', $event)" name="tipo_persona" [required]="true" #tipo_persona="ngModel"
                [control]="tipo_persona">
              </app-select-field>
            </div>
            <div>
              <label appLabel>
                Nombres
              </label>
              <app-input-field [ngModel]="selectedSafe.nombres" (ngModelChange)="update('nombres', $event)" name="nombres"
                [submitted]="submitted">
              </app-input-field>
            </div>
            <div>
              <label appLabel>
                Apellido Paterno
              </label>
              <app-input-field [ngModel]="selectedSafe.apellido_paterno" (ngModelChange)="update('apellido_paterno', $event)" name="apellido_paterno"
                [submitted]="submitted">
              </app-input-field>
            </div>
            <div>
              <label appLabel>
                Apellido Materno
              </label>
              <app-input-field [ngModel]="selectedSafe.apellido_materno" (ngModelChange)="update('apellido_materno', $event)" name="apellido_materno"
                [submitted]="submitted">
              </app-input-field>
            </div>

            <div class="md:col-span-3">
              <label appLabel>
                Nombre Comercial
              </label>
              <app-input-field [ngModel]="selectedSafe.nombre_comercial" (ngModelChange)="update('nombre_comercial', $event)" name="nombre_comercial"
                [submitted]="submitted">
              </app-input-field>
            </div>

            <div class="md:col-span-3">
              <label appLabel>
                Razon Social
              </label>
              <app-input-field [ngModel]="selectedSafe.razon_social" (ngModelChange)="update('razon_social', $event)" name="razonSocial"
                [submitted]="submitted" [required]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-3">
              <label appLabel>
                Dirección
              </label>
              <app-input-field [ngModel]="selectedSafe.direccion" (ngModelChange)="update('direccion', $event)" name="direccion"
                [submitted]="submitted" [required]="true">
              </app-input-field>
            </div>

            <div class="md:col-span-1">
              <label appLabel>
                Nombre de Contacto
              </label>
              <app-input-field [ngModel]="selectedSafe.nombre_contacto"
                (ngModelChange)="update('nombre_contacto', $event)" name="nombre_contacto" [submitted]="submitted">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Pais
              </label>
              <app-input-field [ngModel]="selectedSafe.pais"
                (ngModelChange)="update('pais', $event)" name="pais" [submitted]="submitted">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Telefono
              </label>
              <app-input-field [ngModel]="selectedSafe.telefono"
                (ngModelChange)="update('telefono', $event)" name="telefono" [submitted]="submitted">
              </app-input-field>
            </div>
            
            <!-- CHECKBOX -->
            <div class="md:col-span-1">
              <label appLabel>
                Estado
              </label>
              <app-switch-toggle [ngModel]="selectedSafe.estado" (ngModelChange)="update('estado', $event)"
                [ngModelOptions]="{standalone:true}" name="estado" label="Activo">
              </app-switch-toggle>
            </div>            
          </div>
        </div>
        <app-modal-footer [showNewButton]="true" closeText="Cerrar" saveText="Guardar" (create)="onCreate()"
          (close)="close.emit()">
        </app-modal-footer>
      </form>
    </div>
  </div>
</app-modal>
}
