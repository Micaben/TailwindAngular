@if (state?.isOpen) {
<app-modal [isOpen]="state.isOpen" (close)="close.emit()" className="w-full max-w-4xl p-4">
  <div appAutoFocusFirst [focusTrigger]="focusCounter"
    class="no-scrollbar relative w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-11">
    <div class="px-2">
      <h4 class="mb-2 text-2xl font-semibold text-gray-800 dark:text-white/90">
        Vendedores
      </h4>

      <p class="mb-6 text-sm text-gray-500 dark:text-gray-400 lg:mb-7">
        Ingresa o cambia los datos para tener la información actualizada.
      </p>

      <form class="flex flex-col flex-1 overflow-hidden" #form="ngForm" (ngSubmit)="save.emit(form)">
        <div class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="md:col-span-1">
              <label appLabel>Código</label>
              <app-input-field [ngModel]="selectedSafe.codigo" (ngModelChange)="update('codigo', $event)" name="codigo"
                [readonly]="true" [submitted]="submitted" placeholder="AUTO">
              </app-input-field>
            </div>
            <div class="md:col-span-2">
              <label appLabel>Nombres</label>
              <app-input-field [ngModel]="selectedSafe.nombres" (ngModelChange)="update('nombres', $event)" name="n"
                [submitted]="submitted" [required]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-2">
              <label appLabel>Dirección</label>
              <app-input-field [ngModel]="selectedSafe.direccion" (ngModelChange)="update('direccion', $event)"
                name="direccion" [submitted]="submitted">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>Teléfono</label>
              <app-input-field [ngModel]="selectedSafe.telefono" (ngModelChange)="update('telefono', $event)"
                name="telefono" [submitted]="submitted">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>Correo</label>
              <app-input-field [ngModel]="selectedSafe.correo" (ngModelChange)="update('correo', $event)"
                name="correo" [submitted]="submitted">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>DNI</label>
              <app-input-field [ngModel]="selectedSafe.dni" (ngModelChange)="update('dni', $event)" name="dni"
                pattern="^[0-9]*$" [minLength]="8" [maxLength]="8" [onlyNumbers]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>Empresa Predeterminada</label>
              <app-input-field [ngModel]="selectedSafe.empresa" (ngModelChange)="update('empresa', $event)" name="empresa"
                [submitted]="submitted">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Estado
              </label>
              <app-switch-toggle [ngModel]="selectedSafe.estado" (ngModelChange)="update('estado', $event)"
                [ngModelOptions]="{standalone:true}" name="estado" label="Activo">
              </app-switch-toggle>
            </div>
          </div>
        </div>
        <app-modal-footer [showNewButton]="true" closeText="Cerrar" saveText="Guardar" (create)="onCreate()"
          (close)="close.emit()">
        </app-modal-footer>
      </form>
    </div>
  </div>
</app-modal>
}
