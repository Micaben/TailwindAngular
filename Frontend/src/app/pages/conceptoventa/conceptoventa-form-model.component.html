@if (state?.isOpen) {
<app-modal [isOpen]="state.isOpen" (close)="close.emit()" className="w-full max-w-4xl p-4">
  <div appAutoFocusFirst [focusTrigger]="focusCounter"
    class="no-scrollbar relative w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-11">
    <div class="px-2">
      <h4 class="mb-2 text-2xl font-semibold text-gray-800 dark:text-white/90">
        Concepto de venta
      </h4>

      <p class="mb-6 text-sm text-gray-500 dark:text-gray-400 lg:mb-7">
        Ingresa o cambia los datos para tener la información actualizada.
      </p>

      <form class="flex flex-col flex-1 overflow-hidden" #form="ngForm" (ngSubmit)="save.emit(form)">
        <div class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
            <div class="md:col-span-2">
              <label appLabel>Comprobante</label>
              <app-select-field [options]="comprobanteOptions" [ngModel]="selectedSafe.comprobante" (ngModelChange)="update('comprobante', $event)" name="comprobante"
                 [required]="true" #comprobante="ngModel" [control]="comprobante">
              </app-select-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>Serie</label>
              <app-input-field [ngModel]="selectedSafe.serie" (ngModelChange)="update('serie', $event)"
                name="serie" [submitted]="submitted" [required]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>Ultimo</label>
              <app-input-field [ngModel]="selectedSafe.ultimo" (ngModelChange)="update('ultimo', $event)"
                name="ultimo" [submitted]="submitted" [required]="true">
              </app-input-field>
            </div>            
          </div>
        </div>
        <app-modal-footer [showNewButton]="true" closeText="Cerrar" saveText="Guardar"  (create)="onCreate()"
          (close)="close.emit()">
        </app-modal-footer>
      </form>
    </div>
  </div>
</app-modal>
}
