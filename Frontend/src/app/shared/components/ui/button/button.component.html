<button
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
  [ngClass]="
    'inline-flex items-center justify-center gap-2 rounded-lg transition-all duration-200 ' +
    className + ' ' +
    sizeClasses + ' ' +
    variantClasses + ' ' +
    animationClasses + ' ' +
    disabledClasses
  "
>
 <ng-container *ngIf="loading">
  <svg
    class="animate-spin h-4 w-4"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
  >
    <circle
      class="opacity-25"
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="4"
    ></circle>

    <path
      class="opacity-75"
      fill="currentColor"
      d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
    ></path>
  </svg>

  Guardando...
</ng-container>

<ng-container *ngIf="!loading">
  @if (startIcon) {
    <app-icon [name]="startIcon" class="w-5 h-5"></app-icon>
  }

  <ng-content></ng-content>

  @if (endIcon) {
    <span
      class="flex items-center"
      [innerHTML]="endIcon | safeHtml"
    ></span>
  }
</ng-container>
</button>
