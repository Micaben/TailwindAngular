<app-crud-table
  title="Almacenes"
  buttonText="Nuevo"
  [columns]="tableColumns"
  [data]="currentItems"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  (search)="onSearch($event)"
  (create)="openCreateModal()"
  (edit)="openEditModal($event)"
  (pageChange)="currentPage = $event">
</app-crud-table>

<!-- Modal -->
<app-modal [isOpen]="isOpen" *ngIf="isOpen" (close)="closeModal()" className="w-full max-w-4xl p-4">
  <div appAutoFocusFirst
    class="no-scrollbar relative w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-11">
    <div class="px-2">
      <h4 class="mb-2 text-2xl font-semibold text-gray-800 dark:text-white/90">
        Color
      </h4>
      <p class="mb-6 text-sm text-gray-500 dark:text-gray-400 lg:mb-7">
        Ingresa o cambia los datos para tener la informacion actualizada.
      </p>
      <form class="flex flex-col flex-1 overflow-hidden" #form="ngForm" (ngSubmit)="handleSave(form)">
        <div class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
            <div class="md:col-span-1">
              <label class="mb-2 block text-sm font-medium">
                Código
              </label>
              <app-input-field [(ngModel)]="selected.codigo" name="codigo" pattern="^[0-9]*$" [minLength]="2"
                [maxLength]="4" [disabled]="modo === 'editar'" [submitted]="formSubmitted" [onlyNumbers]="true"
                [required]="true"></app-input-field>
            </div>

            <div class="md:col-span-3">
              <label class="mb-2 block text-sm font-medium">
                Descripción
              </label>
              <app-input-field [(ngModel)]="selected.descripcion" name="descripcion" [required]="true"
                [submitted]="formSubmitted">
              </app-input-field>
            </div>
          </div>
        </div>

        <!-- FOOTER -->
        <div class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-between gap-3">
          <div>
            <button type="button" (click)="openCreateModal()"
              class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              <span>Nuevo</span>
            </button>
          </div>
          <div class="flex gap-3 justify-end">
            <button type="button" (click)="closeModal()"
              class="inline-flex items-center gap-2 rounded-lg border px-5 py-2 hover:bg-gray-100">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
              </svg>
              <span>Cerrar </span>
            </button>
            <button type="submit"
              class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
              <span>Guardar</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</app-modal>
