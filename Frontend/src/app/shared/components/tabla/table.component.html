<div class="overflow-hidden">
  <div class="max-w-full px-5 overflow-x-auto sm:px-6">
    <table class="min-w-full table-fixed">
      <!-- HEADER -->
      <thead class="border-gray-100 border-y dark:border-white/[0.05]">
        <tr>
          @for (col of columns; track $index) {
          <th
            class="px-4 py-4 text-center font-semibold text-gray-600 text-theme-sm dark:text-gray-300"
            [style.width]="col.width">
            {{ col.header }}
          </th>
          }

          <th class="w-[15%] px-4 py-4 text-center font-semibold text-gray-600 text-theme-sm dark:text-gray-300">
            Acción
          </th>
        </tr>
      </thead>

      <!-- BODY -->
      <tbody class="divide-y divide-gray-100 dark:divide-white/[0.05]">
        @for (item of data; track $index) {
        <tr class="hover:bg-gray-50 dark:hover:bg-white/[0.02] transition-colors">
          <!-- COLUMNAS -->
          @for (col of columns; track $index) {
          <td class="px-4 py-4 text-center align-middle">
            <div class="line-clamp-2">
              {{ item[col.field] }}
            </div>
          </td>
          }

          <!-- ACCIONES -->
          <td class="px-4 py-4 text-center align-middle">
            <button
              (click)="edit.emit(item)"
              class="text-blue-500 hover:text-blue-700 transition">
              <svg
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                class="size-5">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
                </path>
              </svg>
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
