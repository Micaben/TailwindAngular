<app-crud-table  [columns]="tableColumns" [title]="'Transportistas'" [data]="filteredItems()" (search)="setSearch($event)" (create)="openCreate()"
  (edit)="openEdit($event)">
</app-crud-table>

@if (state().isOpen) {
<!-- Modal -->
<app-modal [isOpen]="state().isOpen" (close)="closeModal()" className="w-full max-w-4xl p-4">
  <div appAutoFocusFirst
    class="no-scrollbar relative w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-11">
    <div class="px-2">
      <h4 class="mb-2 text-2xl font-semibold text-gray-800 dark:text-white/90">
        Transportistas
      </h4>
      <p class="mb-6 text-sm text-gray-500 dark:text-gray-400 lg:mb-7">
        Ingresa o cambia los datos para tener la información actualizada.
      </p>
      <form class="flex flex-col flex-1 overflow-hidden" #form="ngForm" (ngSubmit)="save(form)">
        <div class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="md:col-span-3">
              <label appLabel>
                Empresa de Transporte
              </label>
              <app-select-field [options]="empresa_transporteOptions" [ngModel]="state().selected.ruc ?? ''"
                (ngModelChange)="updateField('ruc', $event)" name="ruc" [required]="true" #ruc="ngModel" [control]="ruc">
              </app-select-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Tipo de documento
              </label>
              <app-select-field [options]="tipo_documentoOptions" [ngModel]="state().selected.tipo_documento ?? ''"
                (ngModelChange)="updateField('tipo_documento', $event)" name="tipo_documento" [required]="true"
                #tipo_documento="ngModel" [control]="tipo_documento">
              </app-select-field>              
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                DNI
              </label>
              <app-input-field [ngModel]="state().selected.dni ?? ''"
                (ngModelChange)="updateField('dni', $event)" name="dni" [submitted]="submitted()"
                [required]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Licencia
              </label>
              <app-input-field [ngModel]="state().selected.licencia ?? ''"
                (ngModelChange)="updateField('licencia', $event)" name="licencia" [submitted]="submitted()"
                [required]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Nombres
              </label>
              <app-input-field [ngModel]="state().selected.nombres ?? ''" (ngModelChange)="updateField('nombres', $event)"
                name="nombres" [submitted]="submitted()" [required]="true" >
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Apellido Paterno
              </label>
              <app-input-field [ngModel]="state().selected.apellido_paterno ?? ''"
                (ngModelChange)="updateField('apellido_paterno', $event)" name="apellido_paterno" [submitted]="submitted()"
                [required]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Apellido Materno
              </label>
              <app-input-field [ngModel]="state().selected.apellido_materno ?? ''"
                (ngModelChange)="updateField('apellido_materno', $event)" name="apellido_materno" [submitted]="submitted()"
                [required]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Unidad
              </label>
              <app-input-field [ngModel]="state().selected.unidad ?? ''" (ngModelChange)="updateField('unidad', $event)"
                name="unidad" [submitted]="submitted()">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Placa
              </label>
              <app-input-field [ngModel]="state().selected.placa ?? ''"
                (ngModelChange)="updateField('placa', $event)" name="placa" [submitted]="submitted()"
                [required]="true">
              </app-input-field>
            </div>
            <div class="md:col-span-1">
              <label appLabel>
                Unidad
              </label>
              <app-input-field [ngModel]="state().selected.descripcion ?? ''"
                (ngModelChange)="updateField('descripcion', $event)" name="descripcion" [submitted]="submitted()" >
              </app-input-field>
            </div>
          </div>
        </div>

        <!-- FOOTER -->
        <app-modal-footer [showNewButton]="true" closeText="Cerrar" saveText="Guardar" (close)="closeModal()"
          (create)="openCreate()">
        </app-modal-footer>
      </form>
    </div>
  </div>
</app-modal>
}
