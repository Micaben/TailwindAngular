<div>
  <app-page-breadcrumb pageTitle="Ingresos" />
  <div class="rounded-2xl border border-gray-200 bg-white pt-4 dark:border-white/[0.05] dark:bg-white/[0.03]">
    <div class="flex flex-col gap-2 px-5 mb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <div>
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
          <form>
            <div class="relative">
              <div class="flex items-center gap-5">
                <app-button (click)="openCreateModal()" size="sm" variant="primary" [startIcon]="boxIcon">
                  Nuevo
                </app-button>
                <app-button type="submit" class="inline-flex items-center gap-2" size="sm">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                  </svg>
                  Guardar
                </app-button>
                <app-button (click)="openCreateModal()" size="sm" variant="primary">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                  </svg>
                  Buscar
                </app-button>
                <app-button (click)="openCreateModal()" size="sm" variant="primary">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 0 1 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5Zm-3 0h.008v.008H15V10.5Z" />
                  </svg>
                  Imprimir
                </app-button>
                <app-button (click)="openCreateModal()" size="sm" variant="primary">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                  </svg>

                  Anular
                </app-button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div appAutoFocusFirst
      class="no-scrollbar relative w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-11">

      <form class="flex flex-col flex-1 overflow-hidden" #form="ngForm" (ngSubmit)="handleSave(form)">
        <div class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
            <div class="md:col-span-1">
              <label class="mb-2 block text-sm font-medium">
                Código
              </label>
              <app-input-field [(ngModel)]="selected.codigo" name="codigo" pattern="^[0-9]*$" [minLength]="2"
                [maxLength]="4" [disabled]="modo === 'editar'" [submitted]="formSubmitted"
                [required]="true"></app-input-field>
            </div>

            <div class="md:col-span-3">
              <label class="mb-2 block text-sm font-medium">
                Descripción
              </label>
              <app-input-field [(ngModel)]="selected.descripcion" name="descripcion" [required]="true"
                [submitted]="formSubmitted">
              </app-input-field>
            </div>
          </div>
        </div>

      </form>
    </div>
  </div>
