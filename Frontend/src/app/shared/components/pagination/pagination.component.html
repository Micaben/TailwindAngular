<!-- Pagination Controls -->
<div class="px-6 py-4 border-t border-gray-200 dark:border-white/[0.05]">

  <div class="flex items-center justify-between gap-3">

    <!-- PREVIOUS -->
    <app-button
      size="sm"
      variant="outline"
      (btnClick)="goToPage(currentPage - 1)"
      [disabled]="!hasPreviousPage()">

      Anterior

    </app-button>

    <!-- PAGINATION -->
    <div class="hidden sm:flex items-center gap-2">

      @for(page of visiblePages(); track page){

      <button
        (click)="goToPage(page)"
        class="flex h-10 min-w-[40px] items-center justify-center rounded-lg border px-3 text-sm font-medium transition-all duration-200"
        [ngClass]="{
          'bg-brand-500 border-brand-500 text-white shadow-theme-xs':
            isActive(page),

          'border-gray-300 text-gray-700 hover:bg-brand-500/10 hover:text-brand-500 dark:border-white/[0.08] dark:text-gray-400 dark:hover:bg-brand-500 dark:hover:text-white':
            !isActive(page)
        }">
        {{ page }}
      </button>
      }
    </div>

    <!-- MOBILE -->
    <span class="sm:hidden text-sm font-medium text-gray-700 dark:text-gray-400">
      {{ currentPage }} / {{ totalPages }}
    </span>
    <!-- NEXT -->
    <app-button
      size="sm"
      variant="outline"
      (btnClick)="goToPage(currentPage + 1)"
      [disabled]="!hasNextPage()">
      Siguiente
    </app-button>

  </div>

</div>
